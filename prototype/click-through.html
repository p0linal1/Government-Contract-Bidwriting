answer. PURLPal does this for Medicare plan documents.`,question:{short:`Which references should the proposal list?`,agentPick:`defenders`,agentReason:`Public defender offices are government clients using Cadocary software every day, the closest match to what the City asked for.`,label:`References`,intro:`Section 1.5 asks for a reference list of jurisdictions using similar software.`,evidence:[{title:`RFP page 3`,detail:`"Reference list of jurisdictions with similar software services."`},{title:`Your files`,detail:`Public defender offices use DocketBot. No city uses an AI research tool from Cadocary yet.`}],ask:`The closest match is the defender offices. They are government clients, but the software is different.`,options:[{id:`defenders`,label:`List the DocketBot defender offices`},{id:`private`,label:`List private PURLPal clients instead`},{id:`none`,label:`Say we have no government references yet`,risk:`No jurisdiction references. The City asked for them.`}]},priceSheet:!1,sections:[{title:`Team and contact`,pages:1,answers:{src:`rfp`,page:3,section:`1.5 Instructions`,quote:`Names of who will be assigned to the project, address and contact information of the firm making the proposal.`},why:`Section 1.5 lists this first, so it opens the proposal. Names are left for you to fill in.`,draft:[`Cadocary LLC is a Washington software company. We build AI tools that answer questions from long, changing documents and show where every answer came from.`,`Project lead: [your name]. Lead engineer: [name]. Trainer: [name]. All three are based in Washington and will stay on the project from contract to launch.`,`Cadocary LLC · [street address] · bids@cadocary.com`],revised:[`Cadocary LLC, Washington. Project lead [your name], lead engineer [name], trainer [name]. [street address] · bids@cadocary.com`]},{title:`Software and services`,pages:3,answers:{src:`rfp`,page:3,section:`1.5 Instructions`,quote:`Description of software and services related to this RFP.`},why:`Each paragraph answers one bullet in Section 1.2, in the same order, so the City can check them off.`,draft:[`A hosted research tool. Nothing is installed on City servers, and staff sign in from a browser.`,`It searches federal and state law, agency rules, the Lakewood Municipal Code, and the adopted design and engineering manuals. Sources refresh every night, so amended rules show up the next morning.`,`Every answer cites the source and section it came from. Answers are drafts until a staff member reviews them, and every answer is kept for the Public Records Act.`,`Research drops straight into the City staff report and notice templates.`],revised:[`A hosted tool that searches law, code, and City manuals, cites every source, waits for staff review, keeps every answer for public records, and fills the staff report and notice templates.`]},{title:`Additional services to consider`,pages:1,answers:{src:`rfp`,page:3,section:`1.5 Instructions`,quote:`Additional services or procedures the City should take into consideration.`},why:`The RFP invites suggestions. These two lower the risk of the June 15 deadline.`,draft:[`Start with one permit type for the first month, then add the rest once staff trust the answers.`,`A short monthly report listing which sources changed and which answers staff corrected.`],revised:[`Launch with one permit type first, and send a monthly report of source changes and staff corrections.`]},{title:`Pricing`,pages:2,answers:{src:`rfp`,page:3,section:`1.5 Instructions`,quote:`Complete pricing for services related to the proposal including all one- time implementation fees and annual subscription fees.`},why:`The RFP asks for one-time and annual fees separately, with sales tax included (Section 1.9).`,draft:[`One-time implementation: {price}, fixed, including Washington State sales tax. This covers setup, loading the sources, citations and review, report templates, records retention, and training.`,`Annual subscription after launch: hosting, nightly source updates, and support, listed separately as the RFP asks.`],revised:[`{price} one-time, fixed, tax included. Annual subscription listed separately.`]},{title:`References`,pages:1,answers:{src:`rfp`,page:3,section:`1.5 Instructions`,quote:`Reference list of jurisdictions with similar software services.`},why:`Written from your answer to the references question.`,draft:[`Government clients that rely on Cadocary software every day: Washington public defender offices using DocketBot. [Office names and contacts.]`],draftFor:{private:[`Clients using PURLPal to answer questions from large document sets, with a citation on every answer. [Client names and contacts.]`],none:[`Cadocary has not yet delivered an AI research tool to a jurisdiction. Our closest work is PURLPal, which answers questions from large document sets with a citation on every answer.`]},revised:[`[Reference names and contacts.]`]},{title:`Schedule`,pages:1,answers:{src:`rfp`,page:3,section:`1.5 Instructions`,quote:`Ability to meet the project schedule and budget.`},why:`Matches the City timeline in Section 1.8 and leaves a month before the grant deadline.`,draft:[`Contract in December 2024. Sources loaded and the tool working by March 2025. Staff training in April and May.`,`Internal launch in May 2025, a full month before the June 15, 2025 grant deadline. All within the {price} price.`],revised:[`Built by March, training in April and May, live in May 2025, a month before June 15.`]},{title:`Litigation`,pages:1,answers:{src:`rfp`,page:3,section:`1.5 Instructions`,quote:`Reference to any pending litigation or judgement rendered in the past three years.`},why:`Required by Section 1.5. Your files show none.`,draft:[`Cadocary LLC has no pending litigation and no judgments rendered against it in the past three years.`],revised:[`No pending litigation and no judgments in the past three years.`]}],start:{stage:`researching`,researchStep:0}},{id:`king-county`,buyer:`King County`,agency:`Department of Public Defense`,title:`Public Defense Case Management`,solicitation:`KC-DPD-2026-114`,value:3e5,source:`FGA`,fit:{label:`Likely eligible`,tone:`good`},due:`Sat, Nov 14 · 2:00 PM`,checkDeadline:!0,pages:60,pageLimit:20,competitors:10,forms:4,hours:1400,price:287500,why:`This is the work DocketBot already does for public defenders, at a size Cadocary usually wins.`,question:{short:`Do you have a third reference?`,agentPick:`purlpal`,agentReason:`PURLPal's document search is the closest of Cadocary's projects. Listing only two references would cost points under Section 7.`,label:`Third reference`,intro:`Section 6.3 asks for 3 references for similar work in the last 5 years. Two in your files qualify.`,evidence:[{title:`DocketBot`,detail:`Washington public defense tools, 2024 to now`},{title:`SpendLogic`,detail:`Compliance documents for federal contractors, 2023`}],ask:`PURLPal is the closest third. It is Medicare plan search, so it is a weaker match.`,options:[{id:`purlpal`,label:`Use PURLPal`,reply:`Done. I'll frame it around document search and data pipelines, which is what carries over.`},{id:`hotels`,label:`Use Hotels4Truckers instead`,reply:`Done. It shows a full web and mobile platform shipped end to end, which covers the implementation side.`},{id:`none`,label:`We only have 2`,reply:`Okay. I'll flag it. Section 7 scores experience at 25 points, so expect to lose a few there.`,risk:`Only 2 references. Experience is worth 25 points.`}]},sections:[{title:`Cover letter`,draft:`Cadocary builds software for Washington public defenders. Our DocketBot tool already runs intake, conflict checks, court dates, and caseloads for defense attorneys across the state. We propose adapting it for the Department of Public Defense.`,revised:`Your attorneys should spend their time on clients, not paperwork. Cadocary already built DocketBot to do exactly that for Washington defenders, and we propose bringing it to the Department of Public Defense.`},{title:`What King County needs`,draft:`The Department runs on a 2009 Access database. Attachment A lists 13 requirements, from five-minute intake to quarterly reports for the State Office of Public Defense. We answer each one in the order the County listed them.`,revised:`One client lives in three places today: the Access database, the court calendar, and a contact log. The County wants one system for all of it, live by September 2027.`},{title:`How we will do it`,draft:`Seven phases, 1,400 hours. Discovery, configuration, the nightly court calendar import, migration of 41,000 records, CJIS hardening, office-by-office training for 210 staff, and a year of support.`,revised:`One office at a time. Each office goes live only after its staff sign off, so nobody is switched over before they are ready.`},{title:`References`,draft:`DocketBot (Washington public defense tools), SpendLogic (compliance documents for federal contractors, 100% audit pass rate reported by the client), and the third reference you chose.`,revised:`Three projects where Cadocary turned a document-heavy process into a few clicks, led by DocketBot for Washington public defenders.`}],start:{stage:`ready`}},{id:`sound-transit`,buyer:`Sound Transit`,agency:`Planning and Analytics`,title:`Rider Data Pipeline`,solicitation:`ST-RFP-0412-26`,product:`PURLPal`,value:85e3,source:`Email`,fit:{label:`Check eligibility`,tone:`warn`},due:`Wed, Dec 2 · 2:00 PM`,pages:48,pageLimit:25,competitors:12,forms:3,insurance:2,hours:450,price:82e3,why:`Strong match for your data pipeline work, but it asks for a small business certification I could not find.`,reqs:[[`clean and combine rider survey and fare card data every week`,`Must`,`meets`,`PURLPal already runs a weekly pipeline that cleans and merges source data.`],[`produce a weekly ridership report for each route`,`Must`,`meets`,`Report generation exists in PURLPal; route format is new but simple.`],[`flag data quality problems before they reach the report`,`Must`,`partial`,`PURLPal logs bad rows but does not alert anyone. Abo 1.2 BACKGROUND
In 2024, the Washington State Department of Commerce released a funding opportunity
to support state law changes through 2SSB 5290 for Local Project Review. This grant
program assists local governments in updating their permitting system through the Paper
to Digital Permitting Grant Program. All work must be completed by June 2025. As part of
this grant award, the City is seeking a AI research tool that includes but not limited to:
• 100% Digital System. We seek a tool that does not require additional City network
server needs or housed on the City server. This search tool will draw off of applicable
federal and state laws, agency rulemaking, Lakewood Municipal Codes, as well as
adopted design and engineering manuals. Validity, reliability and ability to update
data sources as rules are adopted or amended is strongly desired. Outputs of this AI
tool must also be reviewed by City personnel prior to be used in an official capacity.
• Cybersecurity, resiliency and copyrights. The AI tool must be consistent with the
City’s Information Technology policies. Respondents need to address cybersecurity,
data integrity, privacy protections and possible copyrights or trademarks if awarded.
• Transparency and accountability. Ensure prompts and outputs reference data
sources and appropriate citations. Outputs must also be retained to ensure
compliance with the Washington State Public Records Act (Chapter 42.56 RCW).
• Report. The search tool should be able to populate the research into custom
templates such as a staff report and notices.
